name: WMix Phase 1 - Windows validation
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'engine/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/phase1-validation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'engine/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase1-validation.yml'
  workflow_dispatch:

jobs:
  web-and-desktop-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Configure standalone native frame engine (without libobs)
        run: cmake -S engine -B engine/build -DWMIX_WITH_LIBOBS=OFF
      - name: Build standalone native frame engine
        run: cmake --build engine/build --config Release
      - name: Upload Windows native engine executable
        uses: actions/upload-artifact@v4
        with:
          name: WMix-Windows-Native-Engine-x64
          path: engine/build/Release/wmix-engine.exe
          if-no-files-found: error
          retention-days: 30
      - name: Run native frame self-test
        run: ctest --test-dir engine/build -C Release --output-on-failure
      - name: Generate and validate a native test frame
        shell: pwsh
        run: |
          $frame = Join-Path $env:RUNNER_TEMP 'wmix-frame.ppm'
          & './engine/build/Release/wmix-engine.exe' --frame $frame
          if ($LASTEXITCODE -ne 0) { throw 'Native frame generator failed' }
          $bytes = [System.IO.File]::ReadAllBytes($frame)
          $header = [System.Text.Encoding]::ASCII.GetBytes("P6`n640 360`n255`n")
          if ($bytes.Length -ne ($header.Length + 640 * 360 * 3)) { throw 'Unexpected PPM frame size' }
          for ($i = 0; $i -lt $header.Length; $i++) {
            if ($bytes[$i] -ne $header[$i]) { throw 'Invalid PPM frame header' }
          }
      - name: Upload native test frame
        uses: actions/upload-artifact@v4
        with:
          name: wmix-native-test-frame
          path: ${{ runner.temp }}/wmix-frame.ppm
          if-no-files-found: error
      - name: Frontend tests
        run: npm test -- --run
      - name: TypeScript and frontend build
        run: npm run build
      - name: Electron host syntax
        run: node --check desktop/main.cjs
      - name: Electron preload syntax
        run: node --check desktop/preload.cjs
      - name: RTMPS engine unit tests
        run: node --test desktop/engine/rtmps-engine.test.mjs
# This job cannot validate native libobs without a matching OBS SDK/runtime,
# a compatible GPU, actual sources, and an end-to-end Windows production test.
