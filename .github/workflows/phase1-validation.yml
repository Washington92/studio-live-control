name: WMix Phase 1 - Windows validation
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'engine/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/phase1-validation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'engine/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase1-validation.yml'
  workflow_dispatch:

jobs:
  web-and-desktop-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies (Bun lock compatibility v2)
        # Electron was added after bun.lock was generated. Keep installation
        # unfrozen until a regenerated bun.lock is committed.
        shell: pwsh
        run: |
          Write-Host "WMix workflow revision: bun-unfrozen-v2"
          Write-Host "Checked-out commit: $env:GITHUB_SHA"
          bun install
          if ($LASTEXITCODE -ne 0) { throw 'Bun dependency installation failed' }
      - name: Configure standalone native frame engine (without libobs)
        run: cmake -S engine -B engine/build -DWMIX_WITH_LIBOBS=OFF
      - name: Build standalone native frame engine
        run: cmake --build engine/build --config Release
      - name: Upload Windows native engine executable
        uses: actions/upload-artifact@v4
        with:
          name: WMix-Windows-Native-Engine-x64
          path: engine/build/Release/wmix-engine.exe
          if-no-files-found: error
          retention-days: 30
      - name: Run native frame self-test
        run: ctest --test-dir engine/build -C Release --output-on-failure
      - name: Generate and validate a native test frame
        shell: pwsh
        run: |
          $frame = Join-Path $env:RUNNER_TEMP 'wmix-frame.ppm'
          & './engine/build/Release/wmix-engine.exe' --frame $frame
          if ($LASTEXITCODE -ne 0) { throw 'Native frame generator failed' }
          $bytes = [System.IO.File]::ReadAllBytes($frame)
          $header = [System.Text.Encoding]::ASCII.GetBytes("P6`n640 360`n255`n")
          if ($bytes.Length -ne ($header.Length + 640 * 360 * 3)) { throw 'Unexpected PPM frame size' }
          for ($i = 0; $i -lt $header.Length; $i++) {
            if ($bytes[$i] -ne $header[$i]) { throw 'Invalid PPM frame header' }
          }
      - name: Upload native test frame
        uses: actions/upload-artifact@v4
        with:
          name: wmix-native-test-frame
          path: ${{ runner.temp }}/wmix-frame.ppm
          if-no-files-found: error
      - name: Frontend tests
        run: npm test -- --run
      - name: TypeScript and frontend build
        run: npm run build
      - name: Electron host syntax
        run: node --check desktop/main.cjs
      - name: Electron preload syntax
        run: node --check desktop/preload.cjs
      - name: RTMPS engine unit tests
        run: node --test desktop/engine/rtmps-engine.test.mjs
      - name: Build standalone offline WMix desktop renderer
        run: bunx vite build --config desktop/vite.config.ts
      - name: Ensure Electron Windows binary is installed
        shell: pwsh
        run: |
          $electronExe = 'node_modules/electron/dist/electron.exe'
          if (!(Test-Path $electronExe)) {
            Write-Host 'Electron binary missing after Bun install; running its official install script.'
            node node_modules/electron/install.js
            if ($LASTEXITCODE -ne 0) { throw 'Electron binary download failed' }
          }
          if (!(Test-Path $electronExe)) { throw 'Electron Windows executable was not installed' }
      - name: Stage WMix Electron desktop for Windows installer
        shell: pwsh
        run: |
          $source = 'node_modules/electron/dist'
          $destination = Join-Path $env:RUNNER_TEMP 'WMix-Desktop-Staging'
          if (!(Test-Path (Join-Path $source 'electron.exe'))) { throw 'Electron Windows executable missing' }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item (Join-Path $source '*') $destination -Recurse -Force
          Rename-Item (Join-Path $destination 'electron.exe') 'WMix.exe'
          $appDir = Join-Path $destination 'resources/app'
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          Copy-Item desktop/main.cjs $appDir
          Copy-Item desktop/preload.cjs $appDir
          New-Item -ItemType Directory -Force -Path (Join-Path $appDir 'assets') | Out-Null
          Copy-Item desktop/assets/wmix-icon.png (Join-Path $appDir 'assets/wmix-icon.png')
          Copy-Item desktop/dist-renderer $appDir -Recurse
          Copy-Item desktop/assets/wmix-icon.png (Join-Path $appDir 'dist-renderer/assets/wmix-icon.png')
          Set-Content -Path (Join-Path $appDir 'package.json') -Encoding utf8 -Value '{"name":"wmix-desktop","version":"0.1.0","private":true,"main":"main.cjs"}'
          if (!(Test-Path (Join-Path $appDir 'dist-renderer/index.html'))) { throw 'Offline renderer missing' }
          if (!(Test-Path (Join-Path $appDir 'preload.cjs'))) { throw 'Electron preload missing' }
          if (!(Test-Path (Join-Path $appDir 'main.cjs'))) { throw 'Electron main entry missing' }
          $html = Get-Content (Join-Path $appDir 'dist-renderer/index.html') -Raw
          if ($html -notmatch 'assets/') { throw 'Desktop renderer has no bundled assets' }
          $assets = @(Get-ChildItem (Join-Path $appDir 'dist-renderer/assets') -File -ErrorAction Stop)
          if (@($assets | Where-Object { $_.Extension -eq '.js' }).Count -eq 0) { throw 'Desktop JS bundle missing' }
          if (@($assets | Where-Object { $_.Extension -eq '.css' }).Count -eq 0) { throw 'Desktop CSS bundle missing' }
          if (!(Test-Path (Join-Path $destination 'WMix.exe'))) { throw 'WMix executable missing' }
          # Brand the PE resources; renaming electron.exe alone preserves Electron's icon.
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow install failed' }
          $icon = Join-Path $env:RUNNER_TEMP 'wmix.ico'
          python -c "from PIL import Image; Image.open('desktop/assets/wmix-icon.png').convert('RGBA').save(r'$icon', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128)])"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $icon)) { throw 'Windows icon generation failed' }
          $brandDir = Join-Path $env:RUNNER_TEMP 'wmix-brand-tools'
          New-Item -ItemType Directory -Force -Path $brandDir | Out-Null
          Push-Location $brandDir
          try {
            npm install --no-save --no-package-lock --no-audit --no-fund rcedit@5.0.2
            if ($LASTEXITCODE -ne 0) { throw 'Windows resource editor installation failed' }
            node --input-type=module -e "import { rcedit } from 'rcedit'; await rcedit(process.argv[1], { icon: process.argv[2], 'version-string': { ProductName: 'WMix Studio', FileDescription: 'WMix Studio' } });" (Join-Path $destination 'WMix.exe') $icon
            if ($LASTEXITCODE -ne 0) { throw 'Windows executable icon branding failed' }
          } finally {
            Pop-Location
          }
          if (!(Test-Path (Join-Path $appDir 'assets/wmix-icon.png'))) { throw 'WMix brand icon missing from package' }
      - name: Smoke-test actual Windows Electron renderer
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'WMix-Desktop-Staging/WMix.exe'
          if (!(Test-Path $exe)) { throw 'Packaged WMix.exe not found' }
          $env:WMIX_SMOKE_TEST = '1'
          $env:WMIX_ENGINE_BINARY = ''
          $env:WMIX_SMOKE_SCREENSHOT = Join-Path $env:RUNNER_TEMP 'wmix-desktop-smoke.png'
          $stdout = Join-Path $env:RUNNER_TEMP 'wmix-smoke-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'wmix-smoke-stderr.log'
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (!$process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'WMix Windows smoke test exceeded 60 seconds'
          }
          if (Test-Path $stdout) { Get-Content $stdout | Select-Object -Last 100 }
          if (Test-Path $stderr) { Get-Content $stderr | Select-Object -Last 100 }
          if ($process.ExitCode -ne 0) { throw "WMix React mount smoke test failed: exit $($process.ExitCode)" }
          if (!(Test-Path $env:WMIX_SMOKE_SCREENSHOT)) { throw 'WMix screenshot missing after successful smoke test' }
      - name: Upload Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WMix-Windows-Smoke-Logs
          path: |
            ${{ runner.temp }}/wmix-smoke-stdout.log
            ${{ runner.temp }}/wmix-smoke-stderr.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Windows desktop smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WMix-Windows-Desktop-Screenshot
          path: ${{ runner.temp }}/wmix-desktop-smoke.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Build WMix Studio Windows installer (NSIS)
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installer tool installation failed' }
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path $makensis)) { throw 'NSIS compiler makensis.exe missing' }
          $payload = Join-Path $env:RUNNER_TEMP 'WMix-Desktop-Staging'
          $icon = Join-Path $env:RUNNER_TEMP 'wmix.ico'
          $output = Join-Path $env:GITHUB_WORKSPACE 'WMix-Setup-Windows-x64.exe'
          if (!(Test-Path (Join-Path $payload 'WMix.exe'))) { throw 'WMix application staging folder missing' }
          if (!(Test-Path $icon)) { throw 'WMix installer icon missing' }
          & $makensis "/DWMIX_PAYLOAD_DIR=$payload" "/DWMIX_ICON=$icon" "/DWMIX_OUTPUT=$output" 'desktop/installer/wmix.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'WMix NSIS installer compilation failed' }
          if (!(Test-Path $output)) { throw 'WMix-Setup-Windows-x64.exe was not generated' }
          Write-Host "Generated installer: $output"
      - name: Verify WMix installation and uninstallation
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE 'WMix-Setup-Windows-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'WMixInstalled'
          $installedExe = Join-Path $installDir 'WMix.exe'
          $installer = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "WMix silent installation failed with exit code $($installer.ExitCode)" }
          if (!(Test-Path $installedExe)) { throw 'WMix.exe was not installed' }
          if (!(Test-Path (Join-Path $installDir 'Uninstall.exe'))) { throw 'Windows uninstaller missing' }
          if (!(Test-Path (Join-Path $installDir 'resources/app/dist-renderer/index.html'))) { throw 'Installed WMix renderer missing' }
          Write-Host 'WMix setup installed the application and uninstaller successfully'
          $env:WMIX_SMOKE_TEST = '1'
          $env:WMIX_ENGINE_BINARY = ''
          $appCheck = Start-Process -FilePath $installedExe -PassThru
          if (!$appCheck.WaitForExit(60000)) {
            Stop-Process -Id $appCheck.Id -Force -ErrorAction SilentlyContinue
            throw 'Installed WMix.exe did not complete smoke check within 60 seconds'
          }
          if ($appCheck.ExitCode -ne 0) { throw "Installed WMix.exe failed its smoke check: $($appCheck.ExitCode)" }
          Write-Host 'Installed WMix application opened its React studio successfully'
          $uninstall = Start-Process -FilePath (Join-Path $installDir 'Uninstall.exe') -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "WMix silent uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path $installedExe) { throw 'WMix.exe remained after uninstall' }
          Write-Host 'WMix application uninstalled successfully'
      - name: Upload WMix Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WMix-Setup-Windows-x64
          path: WMix-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
# This job cannot validate native libobs without a matching OBS SDK/runtime,
# a compatible GPU, actual sources, and an end-to-end Windows production test.
