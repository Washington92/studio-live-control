name: WMix Agent - Bun lockfile reconciliation

on:
  push:
    branches:
      - agent/3-bun-lock
    paths:
      - '.github/workflows/agent-bun-lock.yml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wmix-agent-bun-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-lockfile:
    name: Regenerate, validate and push lockfile
    if: github.ref == 'refs/heads/agent/3-bun-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout agent branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Record versions and checked-out commit
        run: |
          node --version
          bun --version
          git rev-parse HEAD
      - name: Regenerate Bun lockfile from package.json
        run: bun install --lockfile-only
      - name: Verify clean installation using frozen lockfile
        run: bun install --frozen-lockfile
      - name: Commit lockfile to agent branch (never main)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/agent/3-bun-lock"
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is unchanged after reconciliation"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "fix(lockfile): synchronize Bun dependencies for Electron"
            git push origin HEAD:refs/heads/agent/3-bun-lock
          fi
      - name: Run available frontend unit tests
        run: npm test -- --run
      - name: Validate frontend production build
        run: npm run build
      - name: Electron host syntax
        run: node --check desktop/main.cjs
      - name: Electron preload syntax
        run: node --check desktop/preload.cjs
      - name: RTMPS engine unit tests
        run: node --test desktop/engine/rtmps-engine.test.mjs
      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          echo "## WMix Agent — Issue #3" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: `agent/3-bun-lock`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lockfile reconciliation: `bun install --lockfile-only`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frozen install: `bun install --frozen-lockfile`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests/build results: see individual GitHub Actions steps; no claims beyond executed steps." >> "$GITHUB_STEP_SUMMARY"
