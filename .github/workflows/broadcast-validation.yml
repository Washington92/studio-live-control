name: Broadcast engine validation

on:
  push:
    branches: [main]
    paths:
      - 'src/components/studio/Studio.tsx'
      - 'src/lib/broadcast/**'
      - 'src/test/**'
      - '.github/workflows/broadcast-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build application
        run: npm run build
